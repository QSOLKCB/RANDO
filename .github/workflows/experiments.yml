name: Experiments
on:
  push:
    paths: ['*.mjs', 'experiment-002/**', 'test/**', '.github/workflows/experiments.yml']
  pull_request:
    paths: ['*.mjs', 'experiment-002/**', 'test/**', '.github/workflows/experiments.yml']
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test
